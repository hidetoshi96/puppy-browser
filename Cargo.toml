[package]
name = "puppy"
version = "0.1.0"
authors = ["Takashi Yoneuchi <takashi.yoneuchi@shift-js.info>"]
edition = "2018"

[[bin]]
name = "puppy"
test = false
bench = false

[dependencies]
log = "0.4"
fern = "0.5"
# NOTE (puppy): `chrono`'s default features (`wasmbind`, which pulls `wasm-bindgen`
# for the `wasm32` target and thus transitively `bumpalo`, plus `iana-time-zone`)
# are not needed here: puppy only uses `chrono::Local` in its CLI logger.
# Disabling them keeps those crates out of puppy's own dependency subtree
# (the same set is enabled for the vendored `cursive-core`; see
# `vendor/cursive/PATCH.md`).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap-verbosity-flag = "3"
thiserror = "1.0"
combine = "4.5.2"
# NOTE (puppy): `cursive` defaults to the `ncurses-backend` feature, which depends on
# the unmaintained (and unfixable, see RUSTSEC-2019-0006 / RUSTSEC-2025-0108) `ncurses`
# crate. We use the `termion-backend` feature instead, which also drops the unmaintained
# `term_size` dependency (ncurses) as well as `crossterm` 0.19 and its dependencies
# (`mio` 0.7 and `instant`, which are unmaintained/vulnerable per RUSTSEC-2024-0019
# and RUSTSEC-2024-0384).
# We also vendor the crate (under `vendor/`) so that its `cursive-core` dependency on
# the unsound and unmaintained `owning_ref` (RUSTSEC-2022-0040, no patched release
# exists) can be redirected to the fixed fork `safer_owning_ref`.
# See `vendor/cursive/PATCH.md` for more details.
cursive = { path = "vendor/cursive", default-features = false, features = ["termion-backend"] }
num-traits = "0.2"
num-derive = "0.4"
url = "2.5"
reqwest = { version = "0.12", features = ["blocking"] }
unicode-width = "0.1.8"
rusty_v8 = "0.22.1"
crossbeam-channel = "0.5.1"

# NOTE (puppy): `rusty_v8 0.22.1` assumes that `std::any::TypeId` is 8 bytes long
# (`TypeIdHasher::write_u64` asserts `size_of::<TypeId>() == size_of::<u64>()`),
# but `TypeId` is a 128-bit value since Rust 1.72, which makes the assertion fail
# at runtime with `left: 16, right: 8`. We therefore vendor a minimally patched
# copy of the crate under `vendor/rusty_v8` that drops the invalid assumption.
# See `vendor/rusty_v8/PATCH.md` for more details.
[patch.crates-io]
rusty_v8 = { path = "vendor/rusty_v8" }
